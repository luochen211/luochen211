<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Career-ops core contributor</title>
  <desc id="desc">Luochen is a core architecture and infrastructure contributor to career-ops with 56 merged pull requests on a project with 72.4 thousand stars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#193039"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9a58"/><stop offset="1" stop-color="#63d8c8"/></linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ink { fill: #f8f3ea; }
      .muted { fill: #9eabb0; }
      .orange { fill: #ff9a58; }
      .teal { fill: #63d8c8; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="20" r="150" fill="#63d8c8" fill-opacity=".07"/>
  <text x="64" y="58" class="mono muted" font-size="14" letter-spacing="4">OPEN SOURCE / CAREER-OPS</text>
  <text x="64" y="116" class="sans ink" font-size="40" font-weight="700">Core architecture contributor</text>
  <text x="64" y="150" class="sans muted" font-size="19">AI job-search infrastructure · shipped upstream</text>
  <g transform="translate(860 42)">
    <text x="0" y="48" class="mono orange" font-size="46" font-weight="700">56</text>
    <text x="0" y="78" class="sans ink" font-size="16">merged PRs</text>
    <text x="142" y="48" class="mono teal" font-size="46" font-weight="700">72.4k</text>
    <text x="142" y="78" class="sans ink" font-size="16">project stars</text>
  </g>
  <path d="M64 190H1136" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 14"/>
  <g transform="translate(64 232)">
    <rect width="250" height="116" rx="18" fill="#ff9a58" fill-opacity=".1" stroke="#ff9a58" stroke-opacity=".65"/>
    <text x="24" y="40" class="mono orange" font-size="13" letter-spacing="2">ARCHITECTURE</text>
    <text x="24" y="68" class="sans ink" font-size="18" font-weight="700"><tspan x="24">Workflows &amp;</tspan><tspan x="24" dy="23">CV artifacts</tspan></text>
  </g>
  <g transform="translate(332 232)">
    <rect width="250" height="116" rx="18" fill="#63d8c8" fill-opacity=".1" stroke="#63d8c8" stroke-opacity=".65"/>
    <text x="24" y="40" class="mono teal" font-size="13" letter-spacing="2">TRUST</text>
    <text x="24" y="68" class="sans ink" font-size="18" font-weight="700"><tspan x="24">Safety &amp;</tspan><tspan x="24" dy="23">fact checks</tspan></text>
  </g>
  <g transform="translate(600 232)">
    <rect width="250" height="116" rx="18" fill="#ff9a58" fill-opacity=".1" stroke="#ff9a58" stroke-opacity=".65"/>
    <text x="24" y="40" class="mono orange" font-size="13" letter-spacing="2">RELIABILITY</text>
    <text x="24" y="68" class="sans ink" font-size="18" font-weight="700"><tspan x="24">Scans, updates</tspan><tspan x="24" dy="23">&amp; tests</tspan></text>
  </g>
  <g transform="translate(868 232)">
    <rect width="268" height="116" rx="18" fill="#63d8c8" fill-opacity=".1" stroke="#63d8c8" stroke-opacity=".65"/>
    <text x="24" y="40" class="mono teal" font-size="13" letter-spacing="2">DELIVERY</text>
    <text x="24" y="68" class="sans ink" font-size="18" font-weight="700"><tspan x="24">PDF, Chinese CV</tspan><tspan x="24" dy="23">&amp; CLI</tspan></text>
  </g>
</svg>
